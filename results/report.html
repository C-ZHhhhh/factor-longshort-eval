  .segmented button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface); }

  .legend button:hover { background: var(--wash); }
  .legend button[aria-pressed="false"] { color: var(--text-muted); }
  .legend button[aria-pressed="false"] .key { opacity: 0.25; }

  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { stroke: var(--axis); stroke-width: 1; }

  .chart .row-label { fill: var(--text-primary); font-size: 13px; }

<main>
  <header>
    <h1>S&amp;P 500 因子回测报告</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <section class="card verdict" aria-labelledby="verdict-title">
    <h2 id="verdict-title"></h2>
    <ul class="points" id="verdict-points"></ul>
  </section>

  <div class="tiles" id="tiles"></div>

  <section class="card" aria-labelledby="nav-title">
    <h2 id="nav-title">净值与回撤</h2>
    <p class="lead">每个策略都从 1.0 出发。净值低于 1.0 表示到那时为止是亏的。</p>
    <div class="controls">
      <span class="hint">收益口径</span>
      <div class="segmented" role="group" aria-label="收益口径" id="mode-toggle">
        <button type="button" data-mode="net" aria-pressed="true">扣除成本</button>
        <button type="button" data-mode="gross" aria-pressed="false">不扣成本</button>
      </div>
      <span class="hint" id="mode-hint"></span>
    </div>
    <figure>
      <figcaption>净值曲线</figcaption>
      <p class="figure-note">点图例可以隐藏或显示某个策略。</p>
      <div class="legend" id="nav-legend"></div>
      <div class="chart" id="nav-chart"></div>
      <div id="nav-table"></div>
    </figure>
    <figure>
      <figcaption>回撤曲线</figcaption>
      <p class="figure-note">当前净值比此前最高点低了多少。0 表示处在最高点。</p>
      <div class="chart" id="dd-chart"></div>
      <div id="dd-table"></div>
    </figure>
  </section>

  <section class="card" aria-labelledby="perf-title">
    <h2 id="perf-title">各策略对比</h2>
    <p class="lead">年化净收益，已扣除交易成本。</p>
    <figure>
      <div class="chart" id="perf-chart"></div>
    </figure>
    <div class="table-scroll" style="max-height:none">
      <table id="perf-table"></table>
    </div>
    <p class="figure-note" id="perf-note" style="margin-top:10px"></p>
  </section>

  <section class="card" aria-labelledby="robust-title">
    <h2 id="robust-title">稳健性</h2>
    <p class="lead" id="robust-lead"></p>
    <div class="panels">
      <figure>
        <figcaption>换时间段</figcaption>
        <p class="figure-note">子样本的年化净收益</p>
        <div class="chart" id="robust-sub"></div>
      </figure>
      <figure>
        <figcaption>换交易成本</figcaption>
        <p class="figure-note">不同成本下的年化净收益</p>
        <div class="chart" id="robust-cost"></div>
      </figure>
      <figure>
        <figcaption>换选股比例</figcaption>
        <p class="figure-note">进入 / 退出阈值</p>
        <div class="chart" id="robust-quantile"></div>
      </figure>
    </div>
    <ul class="points" id="robust-notes" style="margin-top:14px"></ul>
    <div id="robust-table"></div>
  </section>

  <section class="card" aria-labelledby="exposure-title">
    <h2 id="exposure-title">市场暴露</h2>
    <p class="lead" id="exposure-lead"></p>
    <figure>
      <div class="chart" id="exposure-chart"></div>
    </figure>
    <ul class="points" id="exposure-notes"></ul>
    <div id="exposure-table"></div>
  </section>

  <section class="card" aria-labelledby="limits-title">
    <h2 id="limits-title">读这份报告时要注意</h2>
    <ul class="points" id="limitations" style="margin-top:8px"></ul>
  </section>

  <footer id="footer"></footer>
</main>

  function svg(tag, attrs) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const key in attrs || {}) node.setAttribute(key, attrs[key]);
    return node;
  }
  function svgText(text, attrs) {
    const node = svg('text', attrs);
    node.textContent = text;
    return node;
  }
  const pct = (v, digits) => (v == null ? '—' : (v * 100).toFixed(digits == null ? 2 : digits) + '%');
  const num = (v, digits) => (v == null ? '—' : v.toFixed(digits == null ? 2 : digits));
  const seriesColor = (slot) => 'var(--series-' + slot + ')';
  const monthIndex = (ym) => Number(ym.slice(0, 4)) * 12 + Number(ym.slice(5, 7)) - 1;
  const monthLabel = (t) => Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');

  function niceTicks(min, max, count) {
    if (min === max) { min -= 1; max += 1; }
    const rawStep = (max - min) / Math.max(1, count);
    const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const residual = rawStep / magnitude;
    const step = (residual > 5 ? 10 : residual > 2 ? 5 : residual > 1 ? 2 : 1) * magnitude;
    const start = Math.floor(min / step) * step;
    const end = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = start; v <= end + step * 1e-9; v += step) ticks.push(Math.abs(v) < step * 1e-9 ? 0 : v);
    return ticks;
  }

  function fillList(id, items) {
    const list = $(id);
    items.forEach((text) => list.appendChild(el('li', null, text)));
  }

  // 宽度变了才重画 (避免重画改变高度后又触发自己)
  function onWidthChange(host, render) {
    let lastWidth = -1;
    const check = () => {
      const width = host.clientWidth;
      if (width > 0 && width !== lastWidth) { lastWidth = width; render(); }
    };
    if (window.ResizeObserver) new ResizeObserver(check).observe(host);
    window.addEventListener('resize', check);
    check();
  }

  // ---------- 提示框 ----------
  const tooltip = $('tooltip');
  function showTooltip(title, rows, clientX, clientY) {
    tooltip.textContent = '';
    if (title) tooltip.appendChild(el('div', 'title', title));
    rows.forEach((row) => {
      const line = el('div', 'tip-row');
      if (row.slot) {
        const key = el('span', 'key');
        key.style.background = seriesColor(row.slot);
        line.appendChild(key);
      }
      line.appendChild(el('span', 'val', row.value));
      line.appendChild(el('span', 'name', row.name));
      tooltip.appendChild(line);
    });
    tooltip.style.display = 'block';
    const box = tooltip.getBoundingClientRect();
    let left = clientX + 14;
    let top = clientY + 14;
    if (left + box.width > window.innerWidth - 8) left = clientX - box.width - 14;
    if (top + box.height > window.innerHeight - 8) top = clientY - box.height - 14;
    tooltip.style.left = Math.max(8, left) + 'px';
    tooltip.style.top = Math.max(8, top) + 'px';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  // ---------- 数据表 (每张图的无障碍等价物) ----------
  function tableView(host, summaryText, columns, rows) {
    const details = el('details', 'table-view');
    details.appendChild(el('summary', null, summaryText));
    const scroll = el('div', 'table-scroll');
    const table = el('table');
    buildTable(table, columns, rows);
    scroll.appendChild(table);
    details.appendChild(scroll);
    host.appendChild(details);
  }
  function buildTable(table, columns, rows) {
    const head = el('tr');
    columns.forEach((column) => head.appendChild(el('th', null, column)));
    const thead = el('thead');
    thead.appendChild(head);
    table.appendChild(thead);
    const body = el('tbody');
    rows.forEach((cells) => {
      const tr = el('tr');
      cells.forEach((cell) => {
        const td = el('td');
        if (cell && typeof cell === 'object') {
          const swatch = el('span', 'swatch');
          swatch.style.background = seriesColor(cell.slot);
          td.appendChild(swatch);
          td.appendChild(document.createTextNode(cell.text));
        } else {
          td.textContent = cell;
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    table.appendChild(body);
  }

  // ---------- 折线图 ----------
  // options: { series: [{key,label,slot}], points(series) -> [{t,v}], format(v), reference, ariaLabel, hidden:Set }
  function lineChart(host, options) {
    function render() {
      host.textContent = '';
      const width = host.clientWidth || 720;
      const height = 300;
      const margin = { left: 52, right: 16, top: 12, bottom: 28 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;

      const all = options.series.map((s) => ({ meta: s, points: options.points(s) }));
      const visible = all.filter((s) => !options.hidden.has(s.meta.key));
      const scaled = visible.length ? visible : all;

      let tMin = Infinity, tMax = -Infinity;
      all.forEach((s) => s.points.forEach((p) => { tMin = Math.min(tMin, p.t); tMax = Math.max(tMax, p.t); }));
      let vMin = options.reference, vMax = options.reference;
      scaled.forEach((s) => s.points.forEach((p) => { vMin = Math.min(vMin, p.v); vMax = Math.max(vMax, p.v); }));
      const ticks = niceTicks(vMin, vMax, 5);
      const yMin = ticks[0], yMax = ticks[ticks.length - 1];
      const x = (t) => margin.left + ((t - tMin) / (tMax - tMin)) * plotW;
      const y = (v) => margin.top + (1 - (v - yMin) / (yMax - yMin)) * plotH;

      const root = svg('svg', { viewBox: '0 0 ' + width + ' ' + height, height: height });

      ticks.forEach((tick) => {
        const isReference = Math.abs(tick - options.reference) < 1e-9;
        root.appendChild(svg('line', {
          x1: margin.left, x2: width - margin.right, y1: y(tick), y2: y(tick),
          class: isReference ? 'axis' : 'grid',
        }));
        root.appendChild(svgText(options.format(tick), {
          x: margin.left - 8, y: y(tick) + 4, 'text-anchor': 'end', class: 'tick',
        }));
      });

      // 横轴: 每隔若干年标一个年份
      const pxPerYear = (plotW / (tMax - tMin)) * 12;
      const yearStep = Math.max(1, Math.ceil(56 / pxPerYear));
      const firstYear = Math.ceil(tMin / 12);
      for (let year = firstYear; year * 12 <= tMax; year += yearStep) {
        root.appendChild(svgText(String(year), {
          x: x(year * 12), y: height - 8, 'text-anchor': 'middle', class: 'tick',
        }));
      }

      visible.forEach((s) => {
        const d = s.points.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)).join('');
        root.appendChild(svg('path', { d: d, class: 'line', stroke: seriesColor(s.meta.slot) }));
        const last = s.points[s.points.length - 1];
        root.appendChild(svg('circle', {
          cx: x(last.t), cy: y(last.v), r: 4, class: 'dot', fill: seriesColor(s.meta.slot),
        }));
      });

      // 悬停层: 十字线 + 各序列在该月的点
      const crosshair = svg('line', { y1: margin.top, y2: margin.top + plotH, class: 'crosshair', visibility: 'hidden' });
      root.appendChild(crosshair);
      const hoverDots = visible.map((s) => {
        const dot = svg('circle', { r: 4, class: 'dot', fill: seriesColor(s.meta.slot), visibility: 'hidden' });
        root.appendChild(dot);
        return dot;
      });
      const lookups = visible.map((s) => new Map(s.points.map((p) => [p.t, p.v])));

      const hit = svg('rect', {
        x: margin.left, y: margin.top, width: plotW, height: plotH, class: 'hit',
        tabindex: 0, role: 'img', 'aria-label': options.ariaLabel,
      });
      root.appendChild(hit);

      let current = null;
      function update(t, clientX, clientY) {
        current = Math.max(tMin, Math.min(tMax, t));
        const cx = x(current);
        crosshair.setAttribute('x1', cx);
        crosshair.setAttribute('x2', cx);
        crosshair.setAttribute('visibility', 'visible');
        const rows = [];
        visible.forEach((s, i) => {
          const value = lookups[i].get(current);
          if (value == null) { hoverDots[i].setAttribute('visibility', 'hidden'); return; }
          hoverDots[i].setAttribute('cx', cx);
          hoverDots[i].setAttribute('cy', y(value));
          hoverDots[i].setAttribute('visibility', 'visible');
          rows.push({ slot: s.meta.slot, value: options.format(value), name: s.meta.label, sort: value });
        });
        rows.sort((a, b) => b.sort - a.sort);
        if (clientX == null) {
          const box = root.getBoundingClientRect();
          clientX = box.left + (cx / width) * box.width;
          clientY = box.top + margin.top + 8;
        }
        showTooltip(monthLabel(current), rows, clientX, clientY);
      }
      function clear() {
        current = null;
        crosshair.setAttribute('visibility', 'hidden');
        hoverDots.forEach((dot) => dot.setAttribute('visibility', 'hidden'));
        hideTooltip();
      }
      hit.addEventListener('pointermove', (event) => {
        const box = root.getBoundingClientRect();
        const px = ((event.clientX - box.left) / box.width) * width;
        update(Math.round(tMin + ((px - margin.left) / plotW) * (tMax - tMin)), event.clientX, event.clientY);
      });
      hit.addEventListener('pointerleave', clear);
      hit.addEventListener('focus', () => update(tMax));
      hit.addEventListener('blur', clear);
      hit.addEventListener('keydown', (event) => {
        const step = event.key === 'ArrowLeft' ? -1 : event.key === 'ArrowRight' ? 1 : 0;
        if (!step) return;
        event.preventDefault();
        update((current == null ? tMax : current) + step);
      });

      host.appendChild(root);
    }
    onWidthChange(host, render);
    return { render: render };
  }

  // ---------- 横向条形图 ----------
  // options: { rows: [{label, value, slot, tip:[{name,value}]}], format(v), domain:[min,max], thresholds:[{value,label}], labelWidth, ariaLabel }
  function barChart(host, options) {
    function render() {
      host.textContent = '';
      const width = host.clientWidth || 720;
      const rowH = 34;
      const barH = 16;
      // 窄屏时标签列让出一些宽度给条形
      const labelW = Math.min(options.labelWidth || 112, Math.max(84, width * 0.36));
      const valuePad = 58;
      const top = options.thresholds && options.thresholds.length ? 20 : 6;
      const bottom = 26;
      const height = top + options.rows.length * rowH + bottom;

      let dMin = 0, dMax = 0;
      const values = options.rows.map((r) => r.value).concat(options.domain || []);
      (options.thresholds || []).forEach((t) => values.push(t.value));
      values.forEach((v) => { dMin = Math.min(dMin, v); dMax = Math.max(dMax, v); });
      const ticks = niceTicks(dMin, dMax, width < 420 ? 2 : 4);
      dMin = Math.min(dMin, ticks[0]);
      dMax = Math.max(dMax, ticks[ticks.length - 1]);

      const x0 = labelW + (dMin < 0 ? valuePad : 8);
      const x1 = width - (dMax > 0 ? valuePad : 10);
      const x = (v) => x0 + ((v - dMin) / (dMax - dMin)) * (x1 - x0);

      const root = svg('svg', { viewBox: '0 0 ' + width + ' ' + height, height: height, role: 'img', 'aria-label': options.ariaLabel });

      ticks.forEach((tick) => {
        if (tick < dMin - 1e-12 || tick > dMax + 1e-12) return;
        root.appendChild(svg('line', {
          x1: x(tick), x2: x(tick), y1: top, y2: height - bottom, class: tick === 0 ? 'axis' : 'grid',
        }));
        root.appendChild(svgText(options.format(tick, true), {
          x: x(tick), y: height - 8, 'text-anchor': 'middle', class: 'tick',
        }));
      });
      (options.thresholds || []).forEach((threshold) => {
        root.appendChild(svg('line', {
          x1: x(threshold.value), x2: x(threshold.value), y1: top - 4, y2: height - bottom, class: 'threshold',
        }));
        root.appendChild(svgText(threshold.label, {
          x: x(threshold.value), y: top - 8, 'text-anchor': 'middle', class: 'threshold-label',
        }));
      });

      options.rows.forEach((row, i) => {
        const group = svg('g', { class: 'row' });
        const rowTop = top + i * rowH;
        const barTop = rowTop + (rowH - barH) / 2;
        group.appendChild(svg('rect', { x: 0, y: rowTop, width: width, height: rowH, class: 'row-wash', rx: 4 }));
        group.appendChild(svgText(row.label, {
          x: labelW - 10, y: rowTop + rowH / 2 + 4, 'text-anchor': 'end', class: 'row-label',
        }));

        const base = x(0);
        const end = x(row.value);
        const radius = Math.min(4, Math.abs(end - base));
        const direction = end >= base ? 1 : -1;
        // 数据端 4px 圆角, 基线端直角
        const d = 'M' + base + ',' + barTop
          + 'L' + (end - direction * radius) + ',' + barTop
          + 'Q' + end + ',' + barTop + ' ' + end + ',' + (barTop + radius)
          + 'L' + end + ',' + (barTop + barH - radius)
          + 'Q' + end + ',' + (barTop + barH) + ' ' + (end - direction * radius) + ',' + (barTop + barH)
          + 'L' + base + ',' + (barTop + barH) + 'Z';
        group.appendChild(svg('path', { d: d, class: 'bar', fill: seriesColor(row.slot) }));
        group.appendChild(svgText(options.format(row.value), {
          x: end + direction * 6, y: rowTop + rowH / 2 + 4,
          'text-anchor': direction > 0 ? 'start' : 'end', class: 'value',
        }));

        const hit = svg('rect', {
          x: 0, y: rowTop, width: width, height: rowH, class: 'hit', tabindex: 0,
          'aria-label': row.label + ' ' + options.format(row.value),
        });
        const tipRows = row.tip.map((t) => ({ value: t.value, name: t.name }));
        hit.addEventListener('pointermove', (event) => {
          group.classList.add('active');
          showTooltip(row.label, tipRows, event.clientX, event.clientY);
        });
        hit.addEventListener('pointerleave', () => { group.classList.remove('active'); hideTooltip(); });
        hit.addEventListener('focus', () => {
          group.classList.add('active');
          const box = hit.getBoundingClientRect();
          showTooltip(row.label, tipRows, box.left + box.width / 2, box.bottom - 6);
        });
        hit.addEventListener('blur', () => { group.classList.remove('active'); hideTooltip(); });
        group.appendChild(hit);
        root.appendChild(group);
      });

      host.appendChild(root);
    }
    onWidthChange(host, render);
    return { render: render };
  }

  // ======================================================================

  strategies.forEach((s) => { byKey[s.key] = s; });

  // 净值和回撤各有一张逐月数据表 (两种成本口径都列出)

      ],
    })),
    format: (v, isTick) => num(v, isTick ? 1 : 2),
    thresholds: [{ value: -betaThreshold, label: '-' + betaThreshold }, { value: betaThreshold, label: '+' + betaThreshold }],
    labelWidth: 132,
    ariaLabel: '各策略对 ' + meta.benchmark + ' 的 Beta 条形图',
  });
  fillList('exposure-notes', data.exposure_notes);
  tableView(
    $('exposure-table'), '查看市场暴露数据表', ['策略', 'Beta', '是否超标', '月度 Alpha', 'R²'],
    strategies.map((s) => [
      { slot: s.slot, text: s.label }, num(s.exposure.beta, 4), s.exposure.exceeds ? '⚠ 超标' : '✓ 正常',
      pct(s.exposure.alpha, 3), pct(s.exposure.r_squared, 1),
    ])
  );

  // ---------- 局限与页脚 ----------
  fillList('limitations', data.limitations);

  const footer = $('footer');
  footer.appendChild(el('div', null,
    '配置：每 ' + (config.rebalance_freq === '2monthly' ? '2 个月' : config.rebalance_freq) + '调仓 · 最少持有 '
    + config.min_holding_periods + ' 个月 · 排名前/后 ' + Math.round(config.entry_quantile * 100) + '% 进入、掉出 '
    + Math.round(config.exit_quantile * 100) + '% 退出 · 成本 ' + config.cost_bps + ' bps'));
  const generated = el('div', null, '生成时间 ' + meta.generated_at + ' · 代码版本 ');
  generated.appendChild(el('code', null, String(meta.git_commit || '').slice(0, 7)));
  generated.appendChild(document.createTextNode(' · 由 scripts/run_evaluation.py 自动生成，所有数字来自实际运行'));
  footer.appendChild(generated);
})();
</script>
</body>
</html>
