[project]
name = "factor_reg"
version = "0.1.0"
requires-python = ">=3.9"
description = "因子回测系统 - 美股S&P 500 Market-Neutral多空策略"
readme = "README.md"
dependencies = [
    # 数据获取
    "yfinance>=0.2.32",
    "alpaca-py>=0.18.0",

    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",

    # 统计分析
    "statsmodels>=0.14.0",

    # 可视化
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.17.0",

    # 配置
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # 日志
    "loguru>=0.7.0",

    # 进度条
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.0.292",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
